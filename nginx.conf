server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # En local (docker compose) el front y el BFF comparten origen: /api -> BFF
  location /api/ {
    proxy_pass http://ms-vidasalud-bff:8084;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
